name: Build X00TD test13 CameraFix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test13:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      BASE_ZIP: test13.zip
      OUT_ZIP: test13-CameraFix.zip
      RELEASE_TAG: x00td-test13-camerafix-${{ github.run_number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true # Allows downloading large files if you used Git LFS

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y unzip zip python3 device-tree-compiler
      
      - name: Check test13 base zip
        run: |
          if [ ! -f "$BASE_ZIP" ]; then
            echo "::error::You forgot to upload $BASE_ZIP! Please upload test13.zip to your GitHub repository first."
            exit 1
          fi
          unzip -t "$BASE_ZIP"
      
      - name: Extract test13 zip
        run: |
          rm -rf work
          mkdir -p work/tom
          unzip "$BASE_ZIP" -d work/tom
          ls -lah work/tom
      
      - name: Patch test13 DTB for camera and proximity
        run: |
          set -e
          if [ ! -f work/tom/Image.gz-dtb ]; then
            echo "Image.gz-dtb not found in test13 zip"
            exit 1
          fi
          python3 <<'PY'
          import pathlib, struct
          img = pathlib.Path("work/tom/Image.gz-dtb")
          data = img.read_bytes()
          magic = b"\xd0\x0d\xfe\xed"
          candidates = []
          pos = 0
          while True:
              off = data.find(magic, pos)
              if off < 0:
                  break
              if off + 8 <= len(data):
                  totalsize = struct.unpack(">I", data[off + 4:off + 8])[0]
                  if 1024 < totalsize < 4 * 1024 * 1024 and off + totalsize <= len(data):
                      candidates.append((off, totalsize))
              pos = off + 1
          if not candidates:
              raise SystemExit("No appended DTB found")
          off, totalsize = candidates[-1]
          pathlib.Path("work/kernel-prefix.bin").write_bytes(data[:off])
          pathlib.Path("work/tom.dtb").write_bytes(data[off:off + totalsize])
          print(f"DTB offset={off} size={totalsize}")
          PY
          dtc -f -I dtb -O dts -o work/tom.dts work/tom.dtb
          python3 <<'PY'
          import pathlib, re
          p = pathlib.Path("work/tom.dts")
          s = p.read_text()
          def patch_node(text, node_name, patcher):
              marker = node_name + " {"
              start = text.find(marker)
              if start < 0:
                  print(f"Warning: Node not found: {node_name}")
                  return text
              brace = text.find("{", start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          semi = text.find(";", i)
                          end = semi + 1
                          break
              if end is None:
                  raise SystemExit(f"Node end not found: {node_name}")
              block = text[start:end]
              return text[:start] + patcher(block) + text[end:]
          def replace_prop(block, prop, value):
              pattern = rf'(\s*){re.escape(prop)}\s*=\s*<[^;]+>;'
              repl = rf'\1{prop} = {value};'
              new, count = re.subn(pattern, repl, block)
              if count == 0:
                  insert_at = new.rfind("\n")
                  new = new[:insert_at] + f"\n                {prop} = {value};" + new[insert_at:]
              return new
          def remove_prop(block, prop):
              return re.sub(rf'\n\s*{re.escape(prop)}(\s*=\s*<[^;]+>)?;', '', block)
          
          def patch_prox(block):
              block = replace_prop(block, "stk,psctrl-reg", "<0x00000031>")
              block = replace_prop(block, "stk,alsctrl-reg", "<0x00000039>")
              block = replace_prop(block, "stk,ledctrl-reg", "<0x000000ff>")
              block = replace_prop(block, "stk,wait-reg", "<0x0000000a>")
              block = replace_prop(block, "stk,ps-thdh", "<0x00000078>")
              block = replace_prop(block, "stk,ps-thdl", "<0x0000005a>")
              block = remove_prop(block, "stk,use-fir")
              block = remove_prop(block, "stk,ps-gain")
              block = remove_prop(block, "stk,als-gain")
              return block
          
          def patch_actuator(block):
              for prop in [
                  "cam_vaf-supply",
                  "qcom,cam-vreg-name",
                  "qcom,cam-vreg-min-voltage",
                  "qcom,cam-vreg-max-voltage",
                  "qcom,cam-vreg-op-mode",
              ]:
                  block = remove_prop(block, prop)
              return block
          
          def patch_eeprom1(block):
              block = re.sub(
                  r'clocks = <(0x[0-9a-fA-F]+)\s+0x0000001d\s+(0x[0-9a-fA-F]+)\s+0x00000083>;',
                  r'clocks = <\1 0x0000001e \2 0x00000083>;',
                  block
              )
              return block
          
          s = patch_node(s, "stk@48", patch_prox)
          s = patch_node(s, "qcom,actuator@0", patch_actuator)
          s = patch_node(s, "qcom,eeprom@1", patch_eeprom1)
          pathlib.Path("work/tom-patched.dts").write_text(s)
          print("Patched proximity + camera actuator/eeprom settings")
          PY
          dtc -f -I dts -O dtb -o work/tom-patched.dtb work/tom-patched.dts
          python3 <<'PY'
          import pathlib
          prefix = pathlib.Path("work/kernel-prefix.bin").read_bytes()
          dtb = pathlib.Path("work/tom-patched.dtb").read_bytes()
          pathlib.Path("work/tom/Image.gz-dtb").write_bytes(prefix + dtb)
          print("Rebuilt Image.gz-dtb")
          PY
          
      - name: Fix AnyKernel boot block and name
        run: |
          sed -i 's/kernel.string=.*/kernel.string=test13 CameraFix/g' work/tom/anykernel.sh || true
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/g' work/tom/anykernel.sh || true
          sed -i 's/is_slot_device=.*/is_slot_device=0/g' work/tom/anykernel.sh || true
          sed -i 's|^block=.*|block=boot;|g' work/tom/anykernel.sh || true
          sed -i 's|^BLOCK=.*|BLOCK=boot;|g' work/tom/anykernel.sh || true
          
      - name: Create flashable zip
        run: |
          cd work/tom
          zip -r9 "../../$OUT_ZIP" ./*
          cd ../..
          unzip -t "$OUT_ZIP"
          ls -lh "$OUT_ZIP"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test13-CameraFix
          path: ${{ env.OUT_ZIP }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: test13 CameraFix
          body: |
            Patched test13.zip to fix Camera, Flash, and Proximity sensor.
          files: ${{ env.OUT_ZIP }}
