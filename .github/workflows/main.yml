name: Build Kernel

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        
    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/proton-clang

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC="ccache clang"
        
        make O=out X00TD_defconfig
        make -j$(nproc --all) O=out \
                      CC="clang" \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld

    - name: Prepare AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/AnyKernel3/
        cd $GITHUB_WORKSPACE/AnyKernel3
        sed -i 's/kernel.string=.*/kernel.string=Custom Kernel by GitHub Actions/' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=X00TD/' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=ASUS_X00TD/' anykernel.sh
        sed -i 's/device.name3=.*/device.name3=WW_X00TD/' anykernel.sh
        zip -r9 UPDATE-AnyKernel3.zip * -x .git README.md *placeholder

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Compiled-Kernel-X00TD
        path: ${{ github.workspace }}/AnyKernel3/UPDATE-AnyKernel3.zip
