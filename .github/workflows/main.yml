name: Compile X00TD Kernel From Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      RELEASE_TAG: x00td-kernel-source-${{ github.run_number }}
      OUT_ZIP: X00TD-Compiled-Kernel-CameraFix.zip

    steps:
      - name: Checkout Kernel Source (tom/hmp branch)
        uses: actions/checkout@v4
        with:
          repository: Tiktodz/android_kernel_asus_sdm636
          ref: tom/hmp
          path: kernel_source

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/proton-clang

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_source
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC="ccache clang"
          
          # Clean workspace and generate config
          make O=out clean
          make O=out mrproper
          make O=out X00TD_defconfig
          
          # Compile the kernel image and DTB
          make -j$(nproc --all) O=out \
                        CC="clang" \
                        CROSS_COMPILE=aarch64-linux-gnu- \
                        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                        AR=llvm-ar \
                        NM=llvm-nm \
                        OBJCOPY=llvm-objcopy \
                        OBJDUMP=llvm-objdump \
                        STRIP=llvm-strip \
                        LD=ld.lld

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/AnyKernel3
          
          # Check if compilation succeeded
          if [ ! -f "$GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "::error::Kernel compilation failed. Image.gz-dtb not found!"
            exit 1
          fi
          
          cp $GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/AnyKernel3/
          
          cd $GITHUB_WORKSPACE/AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Compiled Kernel CameraFix/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=X00TD/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=ASUS_X00TD/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=WW_X00TD/' anykernel.sh
          
          # Package it into the flashable zip
          zip -r9 ../${{ env.OUT_ZIP }} * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Kernel-X00TD
          path: ${{ github.workspace }}/${{ env.OUT_ZIP }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Compiled Kernel CameraFix
          body: |
            Clean kernel compiled from source (tom/hmp branch) to fix camera crashes.
          files: ${{ github.workspace }}/${{ env.OUT_ZIP }}
